# waf/nginx_modsecurity/rules/agentshield_tuning.conf
# AgentShield Custom ModSecurity Tuning & False-Positive Rule Exclusions

# ------------------------------------------------------------------------------
# 1. Rule Exclusion: AgentShield Security Scanner / Scan Configuration Payloads
# When operators configure target scopes (CIDRs, hostnames, ports), CRS rule
# 942100 (SQLi) or 932100 (RCE) can false-positive on quotes, slashes, or CIDRs.
# ------------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /api/network/scans" \
  "id:100010,\
   phase:2,\
   pass,\
   nolog,\
   ctl:ruleRemoveTargetById=942100;ARGS:target_subnets,\
   ctl:ruleRemoveTargetById=942100;ARGS:excluded_ips"

# ------------------------------------------------------------------------------
# 2. Rule Exclusion: JARVIS LLM Prompts & Security Policy Rules
# Agent prompts sent to /api/agent or /api/jarvis frequently contain words like
# 'SELECT', 'DROP', 'EXEC', or shell commands inside security analysis queries.
# We exclude strict SQLi pattern 942100 and RCE 932100 specifically on the
# prompt body field, while leaving Layer 3 AI Gateway to inspect tool execution!
# ------------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /api/jarvis" \
  "id:100020,\
   phase:2,\
   pass,\
   nolog,\
   ctl:ruleRemoveTargetById=942100;ARGS:prompt,\
   ctl:ruleRemoveTargetById=942100;ARGS:query,\
   ctl:ruleRemoveTargetById=932100;ARGS:prompt"

# ------------------------------------------------------------------------------
# 3. Rule Exclusion: Devanagari / Non-ASCII Unicode Names in UI inputs
# CRS 920270 (Invalid Character in Request) can trigger on valid UTF-8 international characters.
# ------------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /api/" \
  "id:100030,\
   phase:2,\
   pass,\
   nolog,\
   ctl:ruleRemoveById=920270"

# ------------------------------------------------------------------------------
# 4. Mandatory Header Redaction in ModSecurity Log Outputs
# Mask sensitive credentials in ModSecurity audit logs
# ------------------------------------------------------------------------------
SecAction \
  "id:100040,\
   phase:1,\
   pass,\
   nolog,\
   setvar:'tx.mask_headers=Authorization,Cookie,X-API-Key,Proxy-Authorization'"
