# waf/nginx_modsecurity/modsecurity.conf
# ModSecurity v3 Configuration for AgentShield Reverse Proxy

# ------------------------------------------------------------------------------
# 1. Rule Engine Initialization
# Start in DetectionOnly to safely monitor traffic before switching to On (blocking)
# ------------------------------------------------------------------------------
SecRuleEngine DetectionOnly
# Uncomment below for active blocking once false positives have been tuned:
# SecRuleEngine On

# ------------------------------------------------------------------------------
# 2. Request Body Handling & Size Limits
# Enforce a 10MB limit to prevent memory exhaustion / DoS
# ------------------------------------------------------------------------------
SecRequestBodyAccess On
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Response body inspection is disabled to prevent latency and memory buffering
SecResponseBodyAccess Off

# ------------------------------------------------------------------------------
# 3. Temporary Files & File Uploads
# ------------------------------------------------------------------------------
SecTmpDir /tmp/modsecurity/tmp/
SecDataDir /tmp/modsecurity/data/
SecUploadDir /tmp/modsecurity/upload/
SecUploadKeepFiles Off

# ------------------------------------------------------------------------------
# 4. Audit Logging Configuration
# RelevantOnly: logs transactions that caused a warning or 4xx/5xx status
# ------------------------------------------------------------------------------
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/nginx/modsec_audit.log

# ------------------------------------------------------------------------------
# 5. Sensitive Data Masking in Audit Logs
# Never log Authorization tokens, session cookies, or raw passwords
# ------------------------------------------------------------------------------
SecAuditLogMask "password"
SecAuditLogMask "token"
SecAuditLogMask "secret"
SecAuditLogMask "authorization"
SecAuditLogMask "cookie"

# ------------------------------------------------------------------------------
# 6. Default Action
# Anomaly scoring default action when threshold is exceeded in blocking mode
# ------------------------------------------------------------------------------
SecDefaultAction "phase:2,log,auditlog,deny,status:403"

# ------------------------------------------------------------------------------
# 7. Include Core Rule Set (CRS) and AgentShield Custom Tuning
# ------------------------------------------------------------------------------
Include /etc/nginx/modsec/crs-setup.conf
Include /etc/nginx/modsec/coreruleset/rules/*.conf
Include /etc/nginx/modsec/rules/agentshield_tuning.conf
