# waf/nginx_modsecurity/crs-setup.conf
# OWASP ModSecurity Core Rule Set (CRS) v3 Configuration for AgentShield

# ------------------------------------------------------------------------------
# 1. Paranoia Level (PL)
# PL1: Baseline protection with lowest false-positive risk.
# Higher paranoia levels (PL2-PL4) should be evaluated in staging.
# ------------------------------------------------------------------------------
SecAction \
  "id:900000,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.paranoia_level=1"

# ------------------------------------------------------------------------------
# 2. Anomaly Scoring Thresholds
# Inbound threshold: Accumulative score from matched rules before triggering 403
# Recommended: 5 for production, 10 for initial rollout
# ------------------------------------------------------------------------------
SecAction \
  "id:900110,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.inbound_anomaly_score_threshold=5,\
   setvar:tx.outbound_anomaly_score_threshold=4"

# ------------------------------------------------------------------------------
# 3. Allowed HTTP Methods
# Restrict to standard REST API operations
# ------------------------------------------------------------------------------
SecAction \
  "id:900200,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:'tx.allowed_methods=GET HEAD POST PUT DELETE PATCH OPTIONS'"

# ------------------------------------------------------------------------------
# 4. Allowed Request Content Types
# Allow standard JSON, multipart form data, and URL-encoded payloads
# ------------------------------------------------------------------------------
SecAction \
  "id:900220,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:'tx.allowed_request_content_type=|application/json| |application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |text/plain|'"

# ------------------------------------------------------------------------------
# 5. File Upload Restrictions
# Disallow executable extensions from being uploaded through WAF
# ------------------------------------------------------------------------------
SecAction \
  "id:900260,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:'tx.restricted_extensions=.asa/ .asax/ .ascx/ .axd/ .backup/ .bak/ .bat/ .cdx/ .cer/ .cfg/ .cmd/ .com/ .config/ .conf/ .cs/ .csproj/ .csr/ .dat/ .db/ .dbf/ .dll/ .dos/ .htr/ .hta/ .inc/ .ini/ .ink/ .jar/ .jsp/ .lnk/ .log/ .mdb/ .old/ .pass/ .pdb/ .pl/ .pm/ .pwd/ .py/ .sh/ .sql/ .vbs/ .vcs/ .vb/ .vbp/ .vbe/ .ws/ .wsh/'"

# ------------------------------------------------------------------------------
# 6. JSON Request Body Parser Activation
# ModSecurity automatically parses Content-Type: application/json
# ------------------------------------------------------------------------------
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
  "id:900010,\
   phase:1,\
   pass,\
   nolog,\
   t:none,\
   ctl:requestBodyProcessor=JSON"
